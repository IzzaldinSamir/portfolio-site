<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 // Ezzulddin.sys</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #E2E8F0;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .terminal {
            border: 1px solid #FF003C;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.2);
            text-align: center;
        }
        .error {
            color: #FF003C;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .text {
            color: #94A3B8;
            margin-bottom: 20px;
        }
        a {
            color: #00E5FF;
            text-decoration: none;
            border-bottom: 1px solid #00E5FF;
        }
        a:hover {
            color: #fff;
            text-shadow: 0 0 8px #00E5FF;
        }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="error">ERR_404_NOT_FOUND</div>
        <div class="text">The requested directory does not exist on this server.</div>
        <a href="/">cd /home/ezzulddin</a>
    </div>
</body>
</html>
