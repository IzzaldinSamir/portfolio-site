<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 // Ezzulddin.sys</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #E2E8F0;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Better for mobile browsers */
            margin: 0;
            padding: 20px; /* Stops the box from touching the very edges of the screen */
            box-sizing: border-box;
        }
        .terminal {
            border: 1px solid #FF003C;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.2);
            text-align: center;
            width: 100%;
            max-width: 500px;
            word-break: break-word; /* Forces long text to wrap instead of breaking the box */
        }
        .error {
            color: #FF003C;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .text {
            color: #94A3B8;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        a {
            color: #00E5FF;
            text-decoration: none;
            border-bottom: 1px solid #00E5FF;
            transition: all 0.2s ease;
        }
        a:hover {
            color: #fff;
            text-shadow: 0 0 8px #00E5FF;
        }

        /* --- MOBILE FIXES --- */
        @media (max-width: 600px) {
            .terminal {
                padding: 25px 15px; /* Shrinks the padding so there's more room for text */
            }
            .error {
                font-size: 2rem; /* Shrinks the giant error text so it fits perfectly */
            }
        }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="error">ERR_404_NOT_FOUND</div>
        <div class="text">The requested directory does not exist on this server.</div>
        <a href="/">cd /home/ezzulddin</a>
    </div>
</body>
</html>
